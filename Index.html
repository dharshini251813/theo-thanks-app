
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Harshita Shree 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#351641,#100817 65%,#05030a);color:#ffe9f0;font-family:system-ui,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
main{position:relative;z-index:2;max-width:520px;margin:auto;padding:80px 20px 40px;text-align:center}
h1,h2{font-family:Georgia,serif;font-weight:500}
p{line-height:1.8}
.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:12px;color:#ffb8d0}
.muted{color:#d9bdcf}
button{cursor:pointer;font:inherit}
.cta{border:0;border-radius:40px;background:#e84370;color:white;padding:13px 25px;margin-top:20px;box-shadow:0 0 25px #e8437060}
.cta:hover{background:#ff628d}
#music{position:fixed;top:15px;right:15px;z-index:10;border:1px solid #a75a85;border-radius:30px;background:#261333;color:white;padding:10px 15px}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:twinkle 3s infinite alternate}
@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}
.heart{position:absolute;bottom:-30px;color:#ff729d;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
.screen{animation:appear .6s ease both}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.envelope{width:280px;height:175px;margin:40px auto 20px;position:relative;border:1px solid #a76b98;border-radius:12px;background:#321d43;display:block;perspective:600px}
.env-back{position:absolute;inset:0;background:#452653;border-radius:12px}
.env-pocket{position:absolute;inset:0;background:#57305f;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;inset:0 0 auto;height:55%;background:#704073;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.envelope.open .env-flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:#e84370;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;font-size:25px;box-shadow:0 0 22px #ff608e}
.envelope.open .seal{opacity:0}
.paper{background:#fff8ed;color:#38222e;padding:25px;border-radius:15px;text-align:left;line-height:1.7;box-shadow:0 15px 40px #0008}
.paper h2{color:#9f2b4e}
.signature{font:24px Georgia,serif;color:#a52e59}
.balloon-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
.balloon-wrap{min-height:185px;display:flex;align-items:flex-start;justify-content:center;position:relative}
.balloon{width:105px;height:135px;border:0;border-radius:50% 50% 48% 48%;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:inset -8px -12px 20px #0002,0 0 25px #ffffff22;animation:float 3s ease-in-out infinite}
.balloon:nth-child(even){animation-delay:.5s}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
.balloon small{font-size:11px;margin-top:5px}
.string{position:absolute;top:135px;width:1px;height:35px;background:#ffffff55}
.revealed{padding:15px;font-size:14px;line-height:1.6;background:#ffffff0c;border-radius:12px;align-self:center}
.hidden{display:none!important}
#counter{display:inline-block;margin-top:20px;border:1px solid #985276;padding:8px 18px;border-radius:30px}
.big-heart{font-size:75px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#reply-form{margin-top:35px;padding:20px;background:#24142f;border:1px solid #69405f;border-radius:15px;text-align:left}
textarea{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px solid #704866;background:#110b1a;color:white;font:inherit;resize:vertical}
.reply-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
#status{font-size:12px;color:#9cf2c5}
@media(max-width:360px){.envelope{width:250px}.balloon{width:95px;height:125px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<button id="music">♫ Play music</button>
<main id="app"></main>

<script>
const sky=document.getElementById('sky');
for(let i=0;i<65;i++){
 const s=document.createElement('span');
 s.className='star';
 s.style.left=Math.random()*100+'%';
 s.style.top=Math.random()*100+'%';
 s.style.animationDelay=Math.random()*3+'s';
 sky.appendChild(s);
}
for(let i=0;i<14;i++){
 const h=document.createElement('span');
 h.className='heart';
 h.textContent='♥';
 h.style.left=Math.random()*100+'%';
 h.style.fontSize=(12+Math.random()*16)+'px';
 h.style.animationDuration=(15+Math.random()*20)+'s';
 h.style.animationDelay=(-Math.random()*20)+'s';
 sky.appendChild(h);
}

let audio=null,playing=false,timer=null,noteIndex=0;
const notes=[261.63,329.63,392,493.88,440,392,329.63,293.66,196,246.94,293.66,349.23];

function playNote(freq){
 if(!audio)return;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type='triangle';
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(.0001,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.08);
 gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+1.5);
 osc.connect(gain);
 gain.connect(audio.destination);
 osc.start();
 osc.stop(audio.currentTime+1.6);
}
document.getElementById('music').onclick=async()=>{
 if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
 if(playing){
  await audio.suspend();
  playing=false;
  clearInterval(timer);
  document.getElementById('music').textContent='♫ Play music';
 }else{
  await audio.resume();
  playing=true;
  playNote(notes[noteIndex++%notes.length]);
  timer=setInterval(()=>playNote(notes[noteIndex++%notes.length]),800);
  document.getElementById('music').textContent='♫ Pause music';
 }
};

const letter=[
"If my words or actions hurt you, I am truly sorry. I never want to dismiss your feelings or pretend that nothing happened. You deserve to be heard and respected.",
"I cannot go back and change the past, and I know that saying sorry alone cannot fix everything. But I can accept my mistakes, learn from them, and try to do better.",
"I am not asking you to forget your hurt or forgive me immediately. I just wanted you to know that this apology comes from my heart.",
"You are important to me, Harshita. If you are willing, I hope we can find a way to make things right, one step at a time."
];

const balloons=[
{id:'en',label:'SORRY',sub:"I'm truly sorry",color:'#ff5486',msg:"I'm sorry from the bottom of my heart. ❤️"},
{id:'ta',label:'மன்னிப்பு',sub:'மன்னிச்சிடு',color:'#a66cff',msg:'என்னை மன்னிச்சிடு, ஹர்ஷிதா. மனதார மன்னிப்பு கேட்கிறேன். ❤️'},
{id:'hi',label:'माफ़ करना',sub:'मुझे माफ़ कर दो',color:'#e9a936',msg:'हरषिता, मुझे माफ़ कर दो। मुझे सच में बहुत अफ़सोस है। ❤️'},
{id:'kn',label:'ಕ್ಷಮಿಸು',sub:'ನನ್ನನ್ನು ಕ್ಷಮಿಸು',color:'#0bbd94',msg:'ಹರ್ಷಿತಾ, ದಯವಿಟ್ಟು ನನ್ನನ್ನು ಕ್ಷಮಿಸು. ನಾನು ಮನಃಪೂರ್ವಕವಾಗಿ ಕ್ಷಮೆ ಕೇಳುತ್ತೇನೆ. ❤️'}
];

const app=document.getElementById('app');
let popped=[];

function show(html){
 app.innerHTML=html;
 window.scrollTo(0,0);
}
function envelopeScreen(){
 show(`<section class="screen">
 <p class="eyebrow">A little message from my heart</p>
 <h1>For Harshita Shree 💗</h1>
 <p class="muted">There are some words I should have said earlier... and this little letter is for you.</p>
 <button class="envelope" id="env" aria-label="Open envelope">
 <span class="env-back"></span><span class="env-pocket"></span>
 <span class="env-flap"></span><span class="seal">♥</span>
 </button>
 <p class="eyebrow">A letter from Jeevapriyan 💌</p>
 <p class="muted">Tap the envelope to open your letter</p>
 <button class="cta" id="open">Open my letter 💌</button>
 </section>`);
 document.getElementById('env').onclick=openLetter;
 document.getElementById('open').onclick=openLetter;
}
function openLetter(){
 document.getElementById('env')?.classList.add('open');
 if(!playing)document.getElementById('music').click();
 setTimeout(renderLetter,250);
}
function renderLetter(){
 show(`<section class="screen paper">
 <p class="eyebrow">Please read this with your heart</p>
 <h2>Dear Harshita Shree, 💗</h2>
 ${letter.map(p=>`<p>${p}</p>`).join('')}
 <p><i>With a genuinely sorry heart,</i></p>
 <p class="signature">Jeevapriyan ❤️</p>
 <button class="cta" id="next">There's something more for you 🎈</button>
 </section>`);
 document.getElementById('next').onclick=renderBalloons;
}
function renderBalloons(){
 popped=[];
 show(`<section class="screen">
 <p class="eyebrow">Four languages, one sincere apology</p>
 <h1>Pop a balloon 🎈</h1>
 <p class="muted">Each balloon holds a little apology. Tap all four to reveal the final message.</p>
 <div class="balloon-grid">${balloons.map(b=>`
 <div class="balloon-wrap" id="wrap-${b.id}">
 <button class="balloon" data-id="${b.id}" style="background:${b.color}">
 <span>${b.label}</span><small>${b.sub}</small></button>
 <span class="string"></span></div>`).join('')}</div>
 <div id="counter">0 of 4 balloons popped</div>
 <button class="cta hidden" id="final-btn">Open your final message 💗</button>
 </section>`);
 document.querySelectorAll('.balloon').forEach(btn=>btn.onclick=()=>popBalloon(btn));
 document.getElementById('final-btn').onclick=renderFinal;
}
function popBalloon(btn){
 const id=btn.dataset.id;
 if(popped.includes(id))return;
 popped.push(id);
 const b=balloons.find(x=>x.id===id);
 const wrap=document.getElementById('wrap-'+id);
 btn.remove();
 wrap.querySelector('.string')?.remove();
 const msg=document.createElement('div');
 msg.className='revealed';
 msg.textContent=b.msg;
 wrap.appendChild(msg);
 document.getElementById('counter').textContent=`${popped.length} of 4 balloons popped`;
 if(popped.length===4)document.getElementById('final-btn').classList.remove('hidden');
}
function renderFinal(){
 show(`<section class="screen">
 <div class="big-heart">💗</div>
 <p class="eyebrow">One last thing</p>
 <h1>I'm truly sorry, Harshita.</h1>
 <p>Four languages can say “sorry,” but what matters most is the feeling behind those words.</p>
 <p>I cannot undo what happened, but I can learn from it and show through my actions that your feelings matter. I will not rush you to forgive me. I only hope that, when you are ready, we can talk and try to make things right.</p>
 <p>Whatever you feel, I'll respect it. This message is simply my way of saying that I am sincerely sorry.</p>
 <p><i>With a sincere heart,</i></p>
 <p class="signature">Jeevapriyan ❤️</p>
 <button class="cta" id="replay">Read it again ↻</button>
 <form id="reply-form">
 <label for="reply">Leave a word for Jeevapriyan…</label>
 <textarea id="reply" rows="3" maxlength="500" placeholder="Write a few words back…"></textarea>
 <div class="reply-row">
 <span id="status"></span>
 <button type="submit" class="cta">Save reply 💌</button>
 </div>
 </form>
 </section>`);
 document.getElementById('replay').onclick=envelopeScreen;
 document.getElementById('reply-form').onsubmit=e=>{
  e.preventDefault();
  const text=document.getElementById('reply').value.trim();
  if(!text)return;
  try{
   const replies=JSON.parse(localStorage.getItem('heart_replies')||'[]');
   replies.push({message:text,at:new Date().toISOString()});
   localStorage.setItem('heart_replies',JSON.stringify(replies));
   document.getElementById('status').textContent='Saved on this device 💌';
   document.getElementById('reply').value='';
  }catch(err){
   document.getElementById('status').textContent='Could not save this reply.';
  }
 };
}
envelopeScreen();
</script>
</body>
</html>
